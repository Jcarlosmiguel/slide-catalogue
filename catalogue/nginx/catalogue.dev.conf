# Rate-limit zones for the endpoints most worth protecting from brute-force/
# spam abuse: login (password spraying), password reset requests, and the
# two endpoints anonymous visitors can call (contact form, site feedback).
# 10r/m is deliberately generous for a real user, tight for a script.
limit_req_zone $binary_remote_addr zone=catalogue_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=catalogue_public_write:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Baseline security headers - a shipped template's defaults matter,
    # since most deployments won't add these themselves.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /thumbnails/ {
        alias /srv/thumbnails/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /documents/ {
        alias /srv/documents/;
        # Off, not on - this is a public help/documentation folder, but
        # directory listing isn't something a shipped template should
        # default to; individual pages are still served and linked
        # normally, this only stops browsing the raw file listing.
        autoindex off;
    }

    location = /api/login {
        limit_req zone=catalogue_login burst=5 nodelay;
        proxy_pass http://catalogue_backend:8000/api/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/request-password-reset {
        limit_req zone=catalogue_login burst=5 nodelay;
        proxy_pass http://catalogue_backend:8000/api/request-password-reset;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/contact {
        limit_req zone=catalogue_public_write burst=5 nodelay;
        proxy_pass http://catalogue_backend:8000/api/contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/site-feedback {
        limit_req zone=catalogue_public_write burst=5 nodelay;
        proxy_pass http://catalogue_backend:8000/api/site-feedback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://catalogue_backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
