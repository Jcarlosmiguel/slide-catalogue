<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login · MVLS Virtual Microscopy Catalogue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/mvls.css">
</head>

<body>
  <div class="mvls-top-strip">
    University of Glasgow · MVLS
  </div>

  <header class="mvls-header">
    <div class="mvls-header-inner">
      <div class="mvls-brand-block">
        <a href="https://www.gla.ac.uk"><img class="mvls-uog-logo" src="/assets/placeholders/ug-keyline-large.svg" alt="University of Glasgow logo"></a>
        <div class="mvls-brand-text">
          <h1 class="mvls-title"><a href="https://www.gla.ac.uk/colleges/mvls/">MVLS Virtual Microscopy Catalogue</a></h1>
          <p class="mvls-subtitle">Sign in to search the catalogue</p>
        </div>
      </div>
    </div>
  </header>

  <main class="mvls-page">
    <section class="mvls-card" style="max-width: 520px; margin: 2rem auto;">
      <h2>Sign in</h2>

      <p class="mvls-muted">
        Please sign in before searching or viewing slide details.
      </p>

      <form id="login-form">

        <div class="mvls-field">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required>
        </div>

        <div class="mvls-field" style="margin-top: 0.85rem;">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required>
        </div>

        <div class="mvls-actions">
          <button class="mvls-button" type="submit">Sign in</button>
          <span id="login-status" class="mvls-muted"></span>
        </div>

      </form>

      <p class="mvls-muted" style="margin-top: 1rem;">
        <a href="/forgot-password.html">Forgot your password?</a>
      </p>
    </section>
  </main>

  <footer class="mvls-footer">
    <div class="mvls-footer-inner">
      <div>MVLS Virtual Microscopy Catalogue</div>
      <div>
        <a href="/documents/about.html">About</a>
        ·
        <a href="/documents/contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <script src="/js/login.js"></script>
</body>
</html>
