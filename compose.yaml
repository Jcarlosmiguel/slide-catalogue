services:
  catalogue_mariadb:
    image: mariadb:11
    container_name: mvls_catalogue_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - catalogue_mariadb_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - catalogue_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  catalogue_backend:
    build:
      context: ./backend
    container_name: mvls_catalogue_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      APP_ROOT_PATH: ${APP_ROOT_PATH}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET}

      DB_HOST: catalogue_mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}

      SHARE_ROOT_WINDOWS: ${SHARE_ROOT_WINDOWS}
      SHARE_ROOT_MACOS: ${SHARE_ROOT_MACOS}
      SHARE_ROOT_LINUX: ${SHARE_ROOT_LINUX}

    volumes:
      - ./manual_thumbnails:/srv/manual_thumbnails
      - ./thumbnail_backups:/srv/thumbnail_backups
      - ./thumbnails:/srv/thumbnails

    depends_on:
      catalogue_mariadb:
        condition: service_healthy
    networks:
      - catalogue_net

  catalogue_nginx:
    image: nginx:alpine
    container_name: mvls_catalogue_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./thumbnails:/srv/thumbnails:ro
      - ./documents:/srv/documents:ro
      - ./nginx/catalogue.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalogue_backend
    networks:
      - catalogue_net

  adminer:
    image: adminer:latest
    container_name: mvls_catalogue_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      catalogue_mariadb:
        condition: service_healthy
    networks:
      - catalogue_net
    profiles:
      - dev

volumes:
  catalogue_mariadb_data:

networks:
  catalogue_net:
