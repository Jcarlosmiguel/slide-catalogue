<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Search Results · MVLS Virtual Microscopy Catalogue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/mvls.css">
  
  <script src="/js/auth.js"></script>
</head>

<body>
  <div class="mvls-top-strip">
    University of Glasgow · MVLS
  </div>

  <header class="mvls-header">
    <div class="mvls-header-inner">
      <div class="mvls-brand-block">
        <img class="mvls-uog-logo" src="/assets/placeholders/ug-keyline-large.svg" alt="University of Glasgow logo">
        <div class="mvls-brand-text">
          <h1 class="mvls-title">MVLS Virtual Microscopy Catalogue</h1>
          <p class="mvls-subtitle">Clean search results list</p>
        </div>
      </div>

      <nav class="mvls-nav" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/documents/about.html">About</a>
        <a href="/documents/contact.html">Contact</a>
        <a href="/documents/help.html">Help</a>
        <a href="/admin/feedback-management.html" class="mvls-admin-nav">Admin</a>
      </nav>
    </div>
  </header>

  <main class="mvls-page">
    <div class="mvls-return-bar">
      <a class="mvls-button mvls-button-secondary" href="/">← Return to Search</a>
    </div>

    <section class="mvls-result-shell">
      <h2>Search results</h2>
      <p id="results-summary" class="mvls-results-count">Loading results...</p>

      <div class="mvls-results-toolbar">
        <div class="mvls-field">
          <label for="order-by">Order by</label>
          <select id="order-by">
            <option value="slide_id">Slide ID</option>
            <option value="organ">Organ</option>
            <option value="species">Species</option>
            <option value="stain">Stain</option>
            <option value="magnification">Magnification</option>
            <option value="format">Format</option>
            <option value="random">Random</option>
          </select>
        </div>

        <div class="mvls-field">
          <label for="order-dir">Direction</label>
          <select id="order-dir">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>

        <div class="mvls-field">
          <label for="view-mode">View mode</label>
          <select id="view-mode">
            <option value="paged">Paged results</option>
            <option value="all">Single scroll page</option>
          </select>
        </div>

        <div class="mvls-field">
          <label for="page-size">Results per page</label>
          <select id="page-size">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
        </div>

        <button id="apply-results-options" class="mvls-button" type="button">Apply</button>
      </div>

      <div id="results-list" class="mvls-results-list">
      </div>

      <div class="mvls-pagination">
        <button id="prev-page" class="mvls-button mvls-button-secondary" type="button">Previous</button>
        <span id="pagination-status" class="mvls-pagination-status">[/span]
        <button id="next-page" class="mvls-button mvls-button-secondary" type="button">Next</button>
      </div>
    </section>
  </main>

  <footer class="mvls-footer">
    <div class="mvls-footer-inner">
      <div>MVLS Virtual Microscopy Catalogue</div>
      <div>
        <a href="/documents/about.html">About</a>
        ·
        <a href="/documents/contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <script src="/js/results.js"></script>
</body>
</html>
